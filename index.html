<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>To-Do App</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <h1>Task Manager</h1>
            <div class="input-container">
                <input type="text" id="task-input" placeholder="New Task">
                <button class="btn" onclick="addTask()">Add Task</button>
            </div>

            <div class="toolbar">
                <div class="filters" role="tablist" aria-label="Filter Task">
                    <button class="filter-btn active" data-filter="all" role="tab" aria-selected="true">All</button>
                    <button class="filter-btn" data-filter="active" role="tab" aria-selected="false">Active</button>
                    <button class="filter-btn" data-filter="completed" role="tab" aria-selected="false">Completed</button>
                </div>
                <span id="task-count" class="task-count"></span>
            </div>

            <ul id="task-list"></ul>
            <div id="empty-state" class="empty-state" hidden>
                <p>Nothing here yet - add your First Task above.</p>
            </div>

            <button id="clear-completed" class="clear-btn" hidden>Clear Completed</button>
        </div>
        <script src="script.js"></script>
    </body>
</html>
